<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platform Admin — EduTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#060D18;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#0D1B2A;border:1px solid rgba(255,255,255,.08);border-radius:18px;
  padding:42px 38px;width:100%;max-width:380px;box-shadow:0 32px 80px rgba(0,0,0,.4)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.b-icon{width:36px;height:36px;background:rgba(0,194,168,.1);border-radius:9px;
  display:flex;align-items:center;justify-content:center}
.b-icon svg{width:17px;height:17px;color:#00C2A8}
.b-name{font-size:1rem;font-weight:800;color:#fff}
.b-sub{font-size:.7rem;color:rgba(255,255,255,.25);font-family:'JetBrains Mono',monospace;
  letter-spacing:.06em;margin-left:2px}
h2{font-size:1.25rem;font-weight:800;color:#fff;letter-spacing:-.02em;margin-bottom:6px}
p.sub{font-size:.78rem;color:rgba(255,255,255,.3);margin-bottom:26px}
.flash{padding:10px 13px;border-radius:8px;font-size:.78rem;margin-bottom:14px;
  background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.2);
  color:rgba(244,63,94,.9);display:flex;align-items:center;gap:8px}
.flash svg{width:13px;height:13px;flex-shrink:0}
label{display:block;font-size:.72rem;font-weight:700;color:rgba(255,255,255,.35);
  letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
.fg{margin-bottom:14px}
.iw{position:relative}
.iw svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:rgba(255,255,255,.25)}
input{width:100%;padding:10px 12px 10px 35px;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.08);
  border-radius:9px;font-size:.84rem;font-family:inherit;outline:none;
  color:#fff;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:rgba(255,255,255,.18)}
input:focus{border-color:rgba(0,194,168,.5);box-shadow:0 0 0 3px rgba(0,194,168,.1)}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,#00C2A8,#00A891);
  color:#0D1B2A;border:none;border-radius:9px;font-size:.86rem;font-weight:800;
  cursor:pointer;font-family:inherit;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn svg{width:14px;height:14px}
.note{text-align:center;margin-top:22px;font-size:.7rem;color:rgba(255,255,255,.2)}
.note a{color:rgba(255,255,255,.35);transition:color .15s}
.note a:hover{color:rgba(255,255,255,.7)}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="b-icon"><i data-lucide="shield"></i></div>
    <div>
      <div class="b-name">EduTrack</div>
      <div class="b-sub">PLATFORM ADMIN</div>
    </div>
  </div>
  <h2>Super Admin</h2>
  <p class="sub">Restricted access. Authorised personnel only.</p>
  {% with messages=get_flashed_messages(with_categories=true) %}
    {% for cat,msg in messages %}
    <div class="flash"><i data-lucide="shield-alert"></i>{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="fg">
      <label>Username</label>
      <div class="iw"><i data-lucide="user"></i>
        <input type="text" name="username" required autofocus placeholder="admin username">
      </div>
    </div>
    <div class="fg">
      <label>Password</label>
      <div class="iw"><i data-lucide="key-round"></i>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
    </div>
    <button type="submit" class="btn">Access Platform <i data-lucide="arrow-right"></i></button>
  </form>
  <div class="note">
    Not an admin? <a href="{{ url_for('school_login') }}">School login →</a>
  </div>
</div>
<script>lucide.createIcons()</script>
</body>
</html>
