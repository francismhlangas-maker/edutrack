<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register Your School – EduTrack</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#1a3c5e,#2563a8);min-height:100vh;padding:30px 20px;display:flex;align-items:flex-start;justify-content:center}.card{background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:540px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.logo{text-align:center;margin-bottom:24px}.logo h1{font-size:1.5rem;font-weight:800;color:#1a3c5e}.logo h1 span{color:#e8a020}.logo p{font-size:.82rem;color:#64748b;margin-top:4px}h2{font-size:1rem;font-weight:700;color:#1a3c5e;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #f1f5f9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg{margin-bottom:12px}label{display:block;font-size:.8rem;font-weight:600;color:#64748b;margin-bottom:4px}input,select{width:100%;padding:9px 11px;border:1.5px solid #e2e8f0;border-radius:7px;font-size:.86rem;outline:none}input:focus,select:focus{border-color:#2563a8}.btn{width:100%;padding:13px;background:linear-gradient(135deg,#1a3c5e,#2563a8);color:#fff;border:none;border-radius:9px;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:8px}.flash-s{padding:10px;border-radius:7px;font-size:.82rem;margin-bottom:14px;background:#dcfce7;border:1px solid #86efac;color:#15803d}.flash-e{padding:10px;border-radius:7px;font-size:.82rem;margin-bottom:14px;background:#fee2e2;border:1px solid #fca5a5;color:#b91c1c}.note{text-align:center;margin-top:16px;font-size:.78rem;color:#94a3b8}.trial-badge{background:#dcfce7;border:1px solid #86efac;border-radius:8px;padding:10px 14px;font-size:.82rem;color:#15803d;margin-bottom:20px;text-align:center}</style></head>
<body><div class="card">
<div class="logo"><h1>Edu<span>Track</span></h1><p>Register Your School</p></div>
<div class="trial-badge">✅ 30-day free trial — no payment required to start</div>
{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash-{{ 's' if cat=='success' else 'e' }}">{{ msg }}</div>{% endfor %}{% endwith %}
<form method="POST">
<h2>🏫 School Details</h2>
<div class="fg"><label>School Name *</label><input type="text" name="school_name" required placeholder="e.g. BASA Protea Glen Combined School"></div>
<div class="grid">
<div class="fg"><label>Province *</label><select name="province" required><option value="">Select...</option><option>Gauteng</option><option>Western Cape</option><option>KwaZulu-Natal</option><option>Eastern Cape</option><option>Limpopo</option><option>Mpumalanga</option><option>North West</option><option>Free State</option><option>Northern Cape</option></select></div>
<div class="fg"><label>Phone</label><input type="text" name="phone" placeholder="011 000 0000"></div>
</div>
<div class="fg"><label>School Address</label><input type="text" name="address" placeholder="Street, Suburb, City"></div>
<div class="fg"><label>Principal's Name</label><input type="text" name="principal" placeholder="Mr/Mrs/Dr ..."></div>
<h2 style="margin-top:16px">👤 Admin Account</h2>
<div class="fg"><label>Your Name *</label><input type="text" name="contact_name" required placeholder="Full name"></div>
<div class="fg"><label>Email Address * (becomes your username)</label><input type="email" name="email" required placeholder="admin@school.co.za"></div>
<div class="grid">
<div class="fg"><label>Password *</label><input type="password" name="password" required minlength="6" placeholder="Min 6 characters"></div>
<div class="fg"><label>Confirm Password *</label><input type="password" name="confirm_pw" required minlength="6" placeholder="Repeat password"></div>
</div>
<button type="submit" class="btn">Create Account & Start Free Trial →</button>
</form>
<div class="note">Already registered? <a href="{{ url_for('school_login') }}" style="color:#2563a8;font-weight:600">Sign in here</a></div>
</div></body></html>
